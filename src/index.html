<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw DApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>
    <div class="container">
        <header class="text-center my-4">
            <h1>Lucky Draw DApp</h1>
            <p class="lead">Enter the draw and win USDT!</p>
            <div id="networkStatus" class="badge bg-secondary mb-3">Not Connected</div>
        </header>

        <div class="row">
            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Current Draw</h5>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>Entry Fee:</span>
                            <span id="entryFee" class="badge bg-primary">0 USDT</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>Participants:</span>
                            <span id="participantCount" class="badge bg-info">0/2</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>Prize Pool:</span>
                            <span id="prizePool" class="badge bg-success">0 USDT</span>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span>Current Round:</span>
                            <span id="currentRound" class="badge bg-secondary">1</span>
                        </div>
                        <div class="d-grid gap-2">
                            <button id="connectWallet" class="btn btn-primary">Connect Wallet</button>
                            <button id="enterDraw" class="btn btn-success" disabled>Enter Draw</button>
                            <button id="drawWinner" class="btn btn-warning" disabled>Draw Winner</button>
                        </div>
                        <div id="connectionStatus" class="mt-3 text-center" style="display: none;">
                            <small class="text-muted">Connected as: <span id="userAddress"></span></small>
                        </div>
                    </div>
                </div>

                <!-- Admin Controls -->
                <div id="adminControls" class="card mb-4" style="display: none;">
                    <div class="card-body">
                        <h5 class="card-title">Admin Controls</h5>
                        <div class="mb-3">
                            <label for="depositAmount" class="form-label">Deposit Amount (USDT)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="depositAmount" placeholder="Enter amount" step="0.01" min="0.01">
                                <button class="btn btn-primary" id="depositToken">Deposit USDT</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="withdrawAmount" class="form-label">Withdraw Amount (USDT)</label>
                            <div class="input-group">
                                <input type="number" class="form-control" id="withdrawAmount" placeholder="Enter amount" step="0.01" min="0.01">
                                <button class="btn btn-danger" id="withdrawToken">Withdraw USDT</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Recent Winners</h5>
                        <div id="winnersList" class="list-group">
                            <!-- Winners will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <ul class="nav nav-tabs" id="myTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="leaderboard-tab" data-bs-toggle="tab" data-bs-target="#leaderboard" type="button" role="tab">Leaderboard</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="nft-tab" data-bs-toggle="tab" data-bs-target="#nft" type="button" role="tab">My NFTs</button>
                            </li>
                        </ul>
                        <div class="tab-content" id="myTabContent">
                            <div class="tab-pane fade show active" id="leaderboard" role="tabpanel">
                                <div id="leaderboardList" class="list-group mt-3">
                                    <!-- Leaderboard will be populated here -->
                                </div>
                            </div>
                            <div class="tab-pane fade" id="nft" role="tabpanel">
                                <div id="nftGallery" class="row mt-3">
                                    <!-- NFT gallery will be populated here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle">Notification</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
